<a
  href="#hero"
  class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-[100] focus:rounded-lg focus:bg-[var(--accent)] focus:px-3 focus:py-2 focus:text-[var(--accent-fg)]"
>
  Skip to content
</a>

<header
  class="sticky top-0 z-50 border-b border-[var(--border)]/80 bg-[var(--bg)]/85 backdrop-blur-md"
>
  <div class="mx-auto flex h-16 max-w-5xl items-center justify-between gap-4 px-4 sm:px-6">
    <a routerLink="/" class="font-semibold tracking-tight text-[var(--fg)] hover:text-[var(--accent)]">
      {{ profile.name }}
    </a>

    <nav class="hidden items-center gap-1 md:flex" aria-label="Primary">
      @if (isHome()) {
        @for (section of sections; track section.id) {
          <button
            type="button"
            class="rounded-md px-2.5 py-1.5 text-sm transition"
            [class.text-[var(--accent)]]="activeSection() === section.id"
            [class.text-[var(--fg-muted)]]="activeSection() !== section.id"
            (click)="scrollTo(section.id)"
          >
            {{ section.label }}
          </button>
        }
      } @else {
        <a routerLink="/" class="rounded-md px-2.5 py-1.5 text-sm text-[var(--fg-muted)] hover:text-[var(--accent)]">
          Home
        </a>
      }
    </nav>

    <div class="flex items-center gap-1">
      <button
        type="button"
        class="hidden rounded-md px-2.5 py-1.5 text-xs text-[var(--fg-muted)] hover:text-[var(--fg)] sm:inline-flex"
        (click)="openPalette()"
        title="Command palette (Ctrl+K)"
      >
        <kbd class="rounded border border-[var(--border)] px-1.5 py-0.5 font-mono">Ctrl K</kbd>
      </button>
      <button
        type="button"
        class="rounded-md px-2.5 py-1.5 text-sm text-[var(--fg-muted)] hover:text-[var(--accent)]"
        (click)="cycleTheme()"
        [attr.aria-label]="'Theme: ' + themeLabel()"
      >
        {{ themeLabel() }}
      </button>
      <button
        type="button"
        class="rounded-md px-2.5 py-1.5 text-sm text-[var(--fg-muted)] hover:text-[var(--fg)] md:hidden"
        (click)="menuOpen.set(!menuOpen())"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-nav"
      >
        Menu
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <div id="mobile-nav" class="border-t border-[var(--border)] px-4 py-3 md:hidden">
      <div class="flex flex-col gap-1">
        @for (section of sections; track section.id) {
          <button
            type="button"
            class="rounded-md px-2 py-2 text-left text-sm text-[var(--fg-muted)] hover:text-[var(--accent)]"
            (click)="scrollTo(section.id)"
          >
            {{ section.label }}
          </button>
        }
        <button
          type="button"
          class="rounded-md px-2 py-2 text-left text-sm text-[var(--fg-muted)] hover:text-[var(--accent)]"
          (click)="openPalette()"
        >
          Command palette
        </button>
      </div>
    </div>
  }
</header>

<main>
  <router-outlet />
</main>

<footer class="border-t border-[var(--border)]">
  <div
    class="mx-auto flex max-w-5xl flex-col gap-3 px-4 py-10 text-sm text-[var(--fg-muted)] sm:flex-row sm:items-center sm:justify-between sm:px-6"
  >
    <p>© {{ profile.name }} · {{ profile.location }}</p>
    <div class="flex flex-wrap gap-4">
      <a [href]="profile.links.github" target="_blank" rel="noopener" class="hover:text-[var(--accent)]"
        >GitHub</a
      >
      <a
        [href]="profile.links.linkedin"
        target="_blank"
        rel="noopener"
        class="hover:text-[var(--accent)]"
        >LinkedIn</a
      >
      <a routerLink="/privacy" class="hover:text-[var(--accent)]">Privacy</a>
      <button type="button" class="hover:text-[var(--accent)]" (click)="openTerminal()">
        Terminal
      </button>
    </div>
  </div>
</footer>

<app-command-palette (openTerminal)="openTerminal()" />
<app-terminal [open]="terminalOpen()" (requestClose)="closeTerminal()" />
